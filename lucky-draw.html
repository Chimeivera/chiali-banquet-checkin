const key='chiali-banquet-draw-115-v1';
const $=id=>document.getElementById(id);
let state={roster:source,verified:true,winner:null,history:[],claimed:false};
let storageOK=true;
try {
  const saved=localStorage.getItem(key);
  if(saved){
    const previous=JSON.parse(saved);
    if(previous.verified||previous.winner) state={...state,...previous,verified:true};
  }
} catch {storageOK=false;}
let draft, demo=false, practiceWinner=null, practiceHistory=[], busy=false;
const active=()=>state.roster.filter(person=>person.here);
const specialRoles={"1": ["院長室", "院長"], "2": ["院長室", "醫務秘書"], "134": ["院長室", "副院長"], "141": ["醫師公會", "理事長"], "142": ["醫師公會", "全聯會理事長"], "143": ["醫師公會", "常務理事"], "144": ["醫師公會", "常務監事"], "145": ["醫師公會", "常務理事"], "146": ["醫師公會", "常務理事"], "147": ["醫師公會", "監事"], "148": ["醫師公會", "理事"], "149": ["醫師公會", "理事"], "150": ["醫師公會", "監事"], "151": ["醫師公會", "理事"], "152": ["醫師公會", "理事"], "153": ["醫師公會", "顧問"]};
const examples=[{id:1,name:'示範來賓 A',dept:'院長室',role:'醫務秘書'},{id:2,name:'示範來賓 B',dept:'醫師公會',role:'理事長'},{id:3,name:'示範來賓 C'}];
const currentWinner=()=>demo?practiceWinner:state.winner;
const claimed=()=>!demo&&state.claimed;
const history=()=>demo?practiceHistory:state.history;
const candidates=history=> (demo?examples:active()).filter(person=>!history.some(entry=>entry.id===person.id));

const hasMissing=name=>/[\uE000-\uF8FF]/u.test(name);
function save(next){
  try{localStorage.setItem(key,JSON.stringify(next));storageOK=true;}
  catch{storageOK=false;}
  state=next;
}
function render(){
  const winner=currentWinner();
  document.body.classList.toggle('demo',demo);
  $('stage').classList.toggle('revealed',!!winner);
  $('draw').disabled=busy||(!demo&&(!state.verified||!!state.winner));
  $('setup').disabled=busy||!!state.winner||demo;
  $('setup').hidden=!!state.winner||demo;
  $('demo').disabled=busy;
  $('previewOffice').hidden=!demo||busy;
  $('previewAssociation').hidden=!demo||busy;
  $('demo').hidden=!!state.winner;
  $('reset').hidden=busy||!state.winner||claimed();
  $('demo').textContent=demo?'退出彩排':'彩排試抽';
  $('status').textContent=busy?'抽獎進行中…':demo?'彩排專用':state.verified?'請院長按下按鈕':'準備完成後即可開始';

  $('redraw').disabled=!winner||!candidates([...history(),winner]).length;

  $('awardCall').hidden=claimed();
  if(winner){
    const formalInvitation=winner.dept==='院長室'||winner.dept==='醫師公會';

    $('winnerRole').textContent=role||'';
    $('winnerRole').hidden=!role;
    const department=winner.id===142&&winner.dept==='醫師公會'?'':winner.dept;
    $('winnerDetail').textContent=[department,hasMissing(winner.name)?`序號 ${winner.id}`:null].filter(Boolean).join(' · ');
  }
}
function drawIndex(length){
  const random=new Uint32Array(1);
  const limit=2**32-(2**32%length);
  do{crypto.getRandomValues(random);}while(random[0]>=limit);
  return random[0]%length;
}
$('draw').onclick=()=>startDraw();
function startDraw(reason){
  if(busy||claimed())return;
  const previous=currentWinner();
  if(reason?!previous:previous||(!demo&&!state.verified))return;
  const entries=reason?[...history(),{...previous,reason}]:history();
  const pool=candidates(entries);
  if(!pool.length)return;
  const winner=pool[drawIndex(pool.length)];
  busy=true;
  if(demo){practiceWinner=winner;practiceHistory=entries;}
  else save({...state,winner,history:entries});
  $('reset').hidden=true;
  $('awardTools').hidden=true;
  $('stage').classList.remove('revealed');
  $('confetti').replaceChildren();
  $('stage').classList.add('rolling');
  $('draw').disabled=true;
  $('demo').disabled=true;
  $('setup').disabled=true;
  let seconds=5;
  function countdown(){
    const digit=document.createElement('strong');
    digit.id='tick';
    digit.textContent=seconds;
    $('tick').replaceWith(digit);
    if(seconds>1){
      seconds--;
      setTimeout(countdown,1000);
      return;
    }
    setTimeout(()=>{
      busy=false;
      $('stage').classList.remove('rolling');
      render();
      celebrate();
    },1000);
  }
  countdown();
}
function decorate(){
  for(let index=0;index<26;index++){
    const star=document.createElement('i');
    star.textContent=index%4===0?'✦':'·';
    star.style.cssText=`--x:${(index*43)%98}%;--y:${(index*31)%96}%;--size:${12+index%5*4}px;--time:${2+index%4}s;--delay:-${index%7/2}s`;
    $('ambient').append(star);
  }
}
function celebrate(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const confetti=$('confetti');
  confetti.replaceChildren();
  const palette=['#ffdc87','#efad52','#fff0c8','#d49143'];
  for(let index=0;index<48;index++){
    const piece=document.createElement('i');
    piece.style.cssText=`--x:${index*37%100}%;--size:${8+index%6*2}px;--color:${palette[index%4]};--time:${2+index%9/5}s;--delay:${index%10/20}s;--drift:${(index%9-4)*16}px`;
    confetti.append(piece);
  }
  const firstPiece=confetti.firstChild;
  setTimeout(()=>{if(confetti.firstChild===firstPiece)confetti.replaceChildren();},4400);
}
decorate();
function previewWinner(person){
  if(!demo||busy)return;
  practiceWinner=person;
  practiceHistory=[];
  render();
  celebrate();
}
$('previewOffice').onclick=()=>previewWinner(examples[0]);
$('previewAssociation').onclick=()=>{
  const person=source.find(candidate=>candidate.id===142);
  previewWinner({...person,role:specialRoles[person.id][1]});
};
$('demo').onclick=()=>{if(busy||state.winner)return;demo=!demo;practiceWinner=null;practiceHistory=[];$('confetti').replaceChildren();render();};
$('redraw').onclick=()=>startDraw('補抽');
$('reset').onclick=()=>{
  if(busy||!state.winner||claimed())return;
  if(!window.confirm('僅供清除誤按正式抽獎留下的試抽結果。確定要清除目前得主及補抽紀錄，回到開場畫面？'))return;
  save({...state,winner:null,history:[],claimed:false});
  $('confetti').replaceChildren();
  render();
};
$('full').onclick=async()=>{
  try{
    if(document.fullscreenElement)await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  }catch{ $('full').textContent='請按 F11 切換全螢幕'; }
};
document.addEventListener('fullscreenchange',()=>{$('full').textContent=document.fullscreenElement?'退出全螢幕':'全螢幕';});
function count(){
  $('count').textContent=`已勾選 ${draft.filter(person=>person.here).length} 人`;
  $('message').textContent='';
}
function list(){
  const query=$('query').value.trim().toLowerCase();
  $('list').replaceChildren();
  for(const person of draft){
    if(![person.id,person.name,person.dept].some(value=>String(value).toLowerCase().includes(query)))continue;
    const row=document.createElement('div');
    row.className='row';
    const check=document.createElement('input');
    check.type='checkbox';
    check.checked=person.here;
    check.setAttribute('aria-label',`勾選第 ${person.id} 位出席者`);
    check.onchange=()=>{person.here=check.checked;count();};
    const number=document.createElement('span');
    number.textContent=person.id;
    const name=document.createElement('input');
    name.type='text';
    name.value=person.name;
    name.placeholder='輸入姓名';
    name.setAttribute('aria-label',`第 ${person.id} 位姓名`);
    const detail=document.createElement('small');
    const showDetail=()=>{detail.textContent=hasMissing(person.name)?'請核對特殊字元':person.dept;};
    name.oninput=()=>{person.name=name.value.trim();showDetail();count();};
    showDetail();
    row.append(check,number,name,detail);
    $('list').append(row);
  }
  count();
}
$('setup').onclick=()=>{
  if(busy||demo||state.winner)return;
  draft=state.roster.map(person=>({...person}));
  $('query').value='';
  list();
  $('panel').showModal();
};
$('query').oninput=list;
$('all').onclick=()=>{
  if(window.confirm('請確認原名單 153 位皆已到場。要全部勾選嗎？')){
    draft.forEach(person=>{if(person.id<=153)person.here=true;});list();
  }
};
$('none').onclick=()=>{draft.forEach(person=>person.here=false);list();};
$('add').onclick=()=>{
  draft.push({id:Math.max(...draft.map(person=>person.id))+1,name:'',dept:'臨時出席',here:true});
  $('query').value='';
  list();
  $('list').lastElementChild.querySelector('input[type=text]').focus();
};
$('close').onclick=()=>$('panel').close();
$('confirm').onclick=()=>{
  const selected=draft.filter(person=>person.here);
  if(!selected.length){$('message').textContent='請至少勾選 1 位實際出席者。';return;}
  if(selected.some(person=>!person.name)){ $('message').textContent='請補上已勾選者的姓名。';return; }
  if(selected.some(person=>hasMissing(person.name))&&!window.confirm('已勾選名單含特殊字元。若字型無法顯示，請依名單序號核對得主。是否繼續？'))return;
  save({...state,roster:draft.filter(person=>person.name),verified:true});
  $('panel').close();
  render();
  if(!storageOK)$('status').textContent+= ' · 此瀏覽器無法保留結果，請保持頁面開啟';
};
render();
</script>
